# Repo sample (dummy dest / 3GPP TS 35.208 set-1). Quote IMSI / Ki / OP / IMEI.
# Real subscriber + ePDG: copy to swu.lab.yaml (gitignored). Names are ikev2_const.py identifiers.
dest: 192.168.64.1
imsi: "001011234567890"
ki: "000102030405060708090a0b0c0d0e0f"
op: "00112233445566778899aabbccddeeff"
imei: "123456789012347"
no_default_route: true
no_dns: true
export_keys: ./wireshark_keys

ike_sa:
  - protocol: IKE
    spi_size: 0
    transforms:
      - {type: ENCR, id: ENCR_NULL}
      - {type: PRF, id: PRF_HMAC_SHA1}
      - {type: INTEG, id: AUTH_HMAC_SHA1_96}
      - {type: D_H, id: MODP_1024_bit}
  - protocol: IKE
    spi_size: 0
    transforms:
      - {type: ENCR, id: ENCR_AES_CBC, key_length: 128}
      - {type: PRF, id: PRF_HMAC_SHA1}
      - {type: INTEG, id: AUTH_HMAC_SHA1_96}
      - {type: D_H, id: MODP_2048_bit}
  - protocol: IKE
    spi_size: 0
    transforms:
      - {type: ENCR, id: ENCR_AES_CBC, key_length: 128}
      - {type: PRF, id: PRF_HMAC_SHA1}
      - {type: INTEG, id: AUTH_HMAC_SHA1_96}
      - {type: D_H, id: MODP_1024_bit}
  - protocol: IKE
    spi_size: 0
    transforms:
      - {type: ENCR, id: ENCR_AES_CBC, key_length: 128}
      - {type: PRF, id: PRF_HMAC_SHA1}
      - {type: INTEG, id: AUTH_HMAC_SHA1_96}
      - {type: D_H, id: ECP_256_bit}
  - protocol: IKE
    spi_size: 0
    transforms:
      - {type: ENCR, id: ENCR_AES_CBC, key_length: 128}
      - {type: PRF, id: PRF_HMAC_SHA1}
      - {type: INTEG, id: AUTH_HMAC_SHA1_96}
      - {type: D_H, id: ECP_384_bit}
  - protocol: IKE
    spi_size: 0
    transforms:
      - {type: ENCR, id: ENCR_AES_CBC, key_length: 128}
      - {type: PRF, id: PRF_HMAC_SHA1}
      - {type: INTEG, id: AUTH_HMAC_SHA1_96}
      - {type: D_H, id: ECP_521_bit}

child_sa:
  - protocol: ESP
    spi_size: 4
    transforms:
      - {type: ENCR, id: ENCR_AES_GCM_8, key_length: 256}
      - {type: INTEG, id: NONE}
      - {type: ESN, id: ESN_NO_ESN}
  - protocol: ESP
    spi_size: 4
    transforms:
      - {type: ENCR, id: ENCR_AES_CBC, key_length: 128}
      - {type: INTEG, id: AUTH_HMAC_SHA2_256_128}
      - {type: ESN, id: ESN_NO_ESN}
  - protocol: ESP
    spi_size: 4
    transforms:
      - {type: ENCR, id: ENCR_AES_CBC, key_length: 256}
      - {type: INTEG, id: AUTH_HMAC_SHA2_384_192}
      - {type: ESN, id: ESN_NO_ESN}
  - protocol: ESP
    spi_size: 4
    transforms:
      - {type: ENCR, id: ENCR_AES_CBC, key_length: 256}
      - {type: INTEG, id: AUTH_HMAC_SHA2_512_256}
      - {type: ESN, id: ESN_NO_ESN}
  - protocol: ESP
    spi_size: 4
    transforms:
      - {type: ENCR, id: ENCR_AES_CBC, key_length: 256}
      - {type: INTEG, id: AUTH_HMAC_MD5_96}
      - {type: ESN, id: ESN_NO_ESN}
  - protocol: ESP
    spi_size: 4
    transforms:
      - {type: ENCR, id: ENCR_AES_CBC, key_length: 128}
      - {type: INTEG, id: AUTH_HMAC_SHA1_96}
      - {type: ESN, id: ESN_NO_ESN}
  - protocol: ESP
    spi_size: 4
    transforms:
      - {type: ENCR, id: ENCR_AES_CBC, key_length: 256}
      - {type: INTEG, id: AUTH_HMAC_SHA1_96}
      - {type: ESN, id: ESN_NO_ESN}

# IPv6-only inner (one family). Uncomment TS_IPV4_* / INTERNAL_IP4_* / P_CSCF_IP4_* for IPv4 or dual-stack.
ts_initiator:
  # - type: TS_IPV4_ADDR_RANGE
  #   protocol: ANY
  #   start_port: 0
  #   end_port: 65535
  #   start: 0.0.0.0
  #   end: 255.255.255.255
  - type: TS_IPV6_ADDR_RANGE
    protocol: ANY
    start_port: 0
    end_port: 65535
    start: "::"
    end: "ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff"

ts_responder:
  # - type: TS_IPV4_ADDR_RANGE
  #   protocol: ANY
  #   start_port: 0
  #   end_port: 65535
  #   start: 0.0.0.0
  #   end: 255.255.255.255
  - type: TS_IPV6_ADDR_RANGE
    protocol: ANY
    start_port: 0
    end_port: 65535
    start: "::"
    end: "ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff"

cp:
  type: CFG_REQUEST
  attributes:
    # - INTERNAL_IP4_ADDRESS
    # - INTERNAL_IP4_DNS
    - INTERNAL_IP6_ADDRESS
    - INTERNAL_IP6_DNS
    # - P_CSCF_IP4_ADDRESS
    - P_CSCF_IP6_ADDRESS
    - TIMEOUT_PERIOD_FOR_LIVENESS_CHECK
