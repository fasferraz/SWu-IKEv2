# Provoke INVALID_KE_PAYLOAD: KE is MODP_768; ePDG typically wants 2048.
# Expect: event=retry notify=INVALID_KE_PAYLOAD, then CONNECTED if the second proposal matches.
# Quote IMSI / Ki / OP so leading zeros survive YAML.
dest: 192.168.64.1
imsi: "001011234567890"
ki: "000102030405060708090a0b0c0d0e0f"
op: "00112233445566778899aabbccddeeff"
no_default_route: true
no_dns: true
headless: true
log_level: warning

ike_sa:
  - protocol: IKE
    spi_size: 0
    transforms:
      - {type: ENCR, id: ENCR_AES_CBC, key_length: 128}
      - {type: PRF, id: PRF_HMAC_SHA1}
      - {type: INTEG, id: AUTH_HMAC_SHA1_96}
      - {type: D_H, id: MODP_768_bit}
  - protocol: IKE
    spi_size: 0
    transforms:
      - {type: ENCR, id: ENCR_AES_CBC, key_length: 128}
      - {type: PRF, id: PRF_HMAC_SHA1}
      - {type: INTEG, id: AUTH_HMAC_SHA1_96}
      - {type: D_H, id: MODP_2048_bit}
